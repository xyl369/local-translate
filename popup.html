<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Translate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" width="28" height="28" alt="" />
        <div>
          <h1>Local Translate</h1>
          <p class="subtitle">Viewport translate · auto-fill on scroll</p>
        </div>
      </div>
      <span id="status" class="status">Ready</span>
    </header>

    <main>
      <div id="engine" class="engine ok">Engine: Google Translate</div>

      <section class="actions">
        <button id="btn-translate" class="btn primary">Translate page</button>
        <button id="btn-restore" class="btn ghost">Restore original</button>
      </section>

      <section class="actions">
        <button id="btn-yt-subs" class="btn primary">Dual subtitles</button>
        <button id="btn-yt-stop" class="btn ghost">Turn off subtitles</button>
      </section>

      <label class="field">
        <span>Target language</span>
        <select id="targetLang">
          <option value="zh-CN">Simplified Chinese</option>
          <option value="zh-TW">Traditional Chinese</option>
          <option value="en">English</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="es">Spanish</option>
          <option value="ru">Russian</option>
          <option value="pt">Portuguese</option>
          <option value="vi">Vietnamese</option>
          <option value="th">Thai</option>
        </select>
      </label>

      <label class="field">
        <span>Display mode</span>
        <select id="displayMode">
          <option value="bilingual">Bilingual (recommended)</option>
          <option value="translation-only">Translation only</option>
        </select>
      </label>

      <label class="field">
        <span>Translation style</span>
        <select id="translationStyle">
          <option value="muted">Muted follow</option>
          <option value="underline">Underline</option>
          <option value="box">Left accent bar</option>
        </select>
      </label>

      <label class="check">
        <input type="checkbox" id="autoTranslate" />
        <span>Auto-translate on page load</span>
      </label>

      <label class="check">
        <input type="checkbox" id="blockSite" />
        <span id="blockSiteLabel">Never translate this site</span>
      </label>

      <label class="check">
        <input type="checkbox" id="videoSubsAuto" checked />
        <span>YouTube auto dual subtitles</span>
      </label>

      <label class="check">
        <input type="checkbox" id="skipCode" checked />
        <span>Skip code blocks</span>
      </label>
    </main>

    <footer>Translate page = visible area; scroll for more · turn on CC for video subs</footer>

    <script src="popup.js"></script>
  </body>
</html>
